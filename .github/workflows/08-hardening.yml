# EXERCÍCIO 8 (BÔNUS) — Hardening: permissões mínimas + actions fixadas por SHA
#
# Contexto real: em março/2026 o trivy-action teve 76 de 77 tags reescritas com código
# que roubava secrets (CVE-2026-33634). Quem usava @v0.x levou; quem usava @<sha> não.
name: 08 - hardening

on:
  workflow_dispatch:
  pull_request:

# TODO 1: zere as permissões no topo e conceda só o que cada job precisa.
permissions: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # TODO 2: troque a tag pelo SHA do commit. Como achar:
      #   github.com/actions/checkout/releases → clique na tag → copie o commit completo
      #   ou: git ls-remote https://github.com/actions/checkout refs/tags/v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s app -v

  # TODO 3 (discussão): por que `pull_request_target` + checkout do PR é o pior par
  # possível quando o repo é público? (resposta no gabarito)
