# EXERCÍCIO 3 — Secrets: usar de verdade, e ver o que o mascaramento NÃO faz
#
# ANTES DE RODAR:
#   Settings → Secrets   → API_TOKEN = <o token API_TOKEN que VOCÊ recebeu>   (secret: não pode)
name: 03 - secrets

on:
  workflow_dispatch:

env:
  # Padrão commitado pelo instrutor antes da aula (URL não é secret). vars.API_URL, se existir, sobrescreve.
  API_URL: ${{ vars.API_URL || 'https://aula-pipelines-api.whitebeach-095a4bcb.brazilsouth.azurecontainerapps.io' }}

jobs:
  usar-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Jeito certo — secret entra por env, nunca inline no script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "Tamanho do token: ${#API_TOKEN}"
          [ "${#API_TOKEN}" -ge 12 ] || { echo "::error::API_TOKEN ausente ou curto"; exit 1; }

      - name: Deploy em homolog (chamada REAL — olha o placar)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ "$API_URL" = "https://aula-pipelines-api.whitebeach-095a4bcb.brazilsouth.azurecontainerapps.io" ]; then echo "API_URL vazia — modo simulado"; echo "deploy simulado de sha-${GITHUB_SHA::7}"; exit 0; fi
          curl --fail-with-body -sS -X POST "$API_URL/deploy" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"versao\":\"sha-${GITHUB_SHA::7}\",\"ambiente\":\"homolog\"}"

      - name: O que acontece se eu imprimir? (rode e veja o log)
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "token = $API_TOKEN"

      - name: Mascaramento NÃO é segurança
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          # O GitHub só mascara o valor EXATO. Qualquer transformação escapa.
          echo "$API_TOKEN" | rev
          # O instrutor vai pegar esse valor do SEU log, desinverter e fazer um deploy no seu nome.
          # Depois revoga. Assista o placar.

      # TODO 1: tente fazer deploy em "producao" com este mesmo token. O que a API responde? Por quê?
      # TODO 2: adicione um step que use o secret sem env, direto no run:
      #   run: echo "${{ secrets.API_TOKEN }}"
      # Funciona? Sim. Então por que é errado? (resposta no gabarito)
